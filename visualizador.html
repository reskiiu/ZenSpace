<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenSpace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="images/logo.png" alt="Logo ZenSpace" width="110" height="35">
        </div>
        <nav class="menu">
            <a href="index.html" class="link">Inicio</a>
            <a href="catalogo.html" class="link">Catalogo</a>
            <a href="visualizador.html" class="link">Visualizador 3D</a>
        </nav>
                <nav class="menu_1">
            <a href="carrito.html" class="btn-carrito"><i class="bi bi-basket"></i></a>
            <a href="perfil.html" class="btn-perfil"><i class="bi bi-person"></i></a>
        </nav>
    </header>

<section class="visualizador">

    <aside class="panel-3d">

      <div class="panel-titulo">
        <i class="bi bi-cursor"></i>
          <div>
            <h2>Catálogo 3D</h2>
            <p>Selecciona para visualizar</p>
          </div>
      </div>

    <div class="lista-3d">

        <div class="item-3d">  
          <img src="images/silla.png" alt="Silla Ergonomica">
          <div class="item-info">
            <h3>Silla Ergornomica</h3>
            <span>$129.99</span>
          </div>
          <i class="bi bi-three-dots"></i>
        </div>

      <div class="item-3d">
        <img src="images/comedor.png" alt="Mesa Comedor Moderna">
        <div class="item-info">
            <h3>Mesa Comedor Moderna</h3>
            <span>$88.99</span>
        </div>
        <i class="bi bi-three-dots"></i>
      </div>

      <div class="item-3d">
        <img src="images/adornos.png" alt="Adornos Modernos">
        <div class="item-info">
            <h3>Adornos Modernos</h3>
            <span>$29.99</span>
        </div>
        <i class="bi bi-three-dots"></i>
      </div>
    </div>

      <div class="resumen-3d">
        <div class="total-productos3d">
            <span>Total Estimado</span>
            <strong>$248.97</strong>
        </div>

        <button class="btn-look">
            <i class="bi bi-cart3"></i>
            Comprar este look
        </button>

      </div>

    </aside>

    <div class="lienzo-3d">
        <div class="visualizacion">
            <i class="bi bi-image"></i>
            <h3>Espacio en blanco</h3>
            <p>Arrastra o seleciona un articulo para visualizarlo</p>
        </div>

    </div>

</section>
