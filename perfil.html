<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenSpace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="images/logo.png" alt="Logo ZenSpace" width="110" height="35">
        </div>
        <nav class="menu">
            <a href="index.html" class="link">Inicio</a>
            <a href="catalogo.html" class="link">Catalogo</a>
            <a href="visualizador.html" class="link">Visualizador 3D</a>
        </nav>
                <nav class="menu_1">
            <a href="carrito.html" class="btn-carrito"><i class="bi bi-basket"></i></a>
            <a href="perfil.html" class="btn-perfil"><i class="bi bi-person"></i></a>
        </nav>
    </header>

    <section class="perfil">

    <div class="contenedor-perfil">

        <div class="informacion-perfil">
            <img src="images/usuario.jpg" alt="Usuario">
            <div class="datos-usuario">
                <h2>Usuario Zen</h2>
                <p>usuario@zenspace.com</p>
                <button class="btn-cerrar">
                <i class="bi bi-box-arrow-left"></i>
                Cerrar Sesión
                </button>
            </div>
        </div>

        <div class="contenedor-puntos">
            <i class="bi bi-star-fill"></i>
            <h2>450</h2>
            <p>Puntos Zen</p>
        </div>
    </div>

    <h2 class="titulo-historial">
      Historial de Pedidos
    </h2>

    <div class="pedido">
        <div class="informacion-pedido">
            <div class="icono-pedido">
              <i class="bi bi-box-seam"></i>
            </div>
            <div>
              <h3>#ORD-001</h3>
              <p>12 Oct, 2023</p>
            </div>
        </div>

        <span class="estado camino">
          En camino
        </span>
        <strong>$129.99</strong>
    </div>

    <div class="pedido">
        <div class="informacion-pedido">
            <div class="icono-pedido">
                <i class="bi bi-box-seam"></i>
            </div>
            <div>
                <h3>#ORD-002</h3>
                <p>05 Sep, 2023</p>
            </div>
        </div>
        <span class="estado entregado">
            Entregado
        </span>
        <strong>$450.00</strong>
    </div>

</section>

<script src="app.js"></script>
</body>
</html>
